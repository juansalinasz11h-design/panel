<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>#@%$#@ — Made by alex</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-soft: #10161e;
    --panel: #141b25;
    --panel-2: #111821;
    --well: #0a0f16;
    --border: #232c39;
    --border-strong: #334154;
    --text: #e6edf3;
    --muted: #9aa8ba;
    --dim: #6d7a8c;
    --accent: #ff2a2a;
    --accent-hover: #ff4d4d;
    --accent-soft: rgba(255, 42, 42, 0.12);
    --accent-line: rgba(255, 80, 80, 0.45);
    --green: #3fb950;
    --amber: #d29922;
    --red: #ff2a2a;
    --mono: "Cascadia Mono", "Cascadia Code", Consolas, monospace;
    --sans: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background:
      linear-gradient(180deg, rgba(255, 42, 42, 0.035), transparent 220px),
      var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
    font-size: 13px;
    line-height: 1.45;
  }

  ::selection { background: rgba(255, 42, 42, 0.35); }

  button:focus-visible,
  input:focus-visible,
  select:focus-visible {
    outline: 2px solid var(--accent-line);
    outline-offset: 2px;
  }

  .main::-webkit-scrollbar,
  .log-box::-webkit-scrollbar { width: 8px; }
  .main::-webkit-scrollbar-track,
  .log-box::-webkit-scrollbar-track { background: transparent; }
  .main::-webkit-scrollbar-thumb,
  .log-box::-webkit-scrollbar-thumb {
    background: #2a3443;
    border-radius: 8px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-soft);
    flex-shrink: 0;
  }

  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }

  .logo-box {
    width: 34px;
    height: 34px;
    border-radius: 7px;
    background: #2a1010;
    border: 1px solid #5a2020;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  .logo-box svg path { fill: #ffb4ae; }
  .logo-box svg circle { fill: #ff2a2a; }

  .brand-title {
    font-size: 14px;
    font-weight: 650;
    letter-spacing: 0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }

  .avatar-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    background: transparent;
    border: 1px solid #5a2020;
    color: #ff8a80;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .brand-sub {
    font-size: 11.5px;
    color: var(--dim);
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .top-right { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 10.5px;
    font-weight: 650;
    letter-spacing: 0.045em;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--muted);
    white-space: nowrap;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--amber);
    flex-shrink: 0;
  }
  .dot.ok { background: var(--green); }
  .dot.bad { background: var(--red); }
  .dot.spin { background: var(--accent-hover); animation: pulse 1.1s ease-in-out infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .main {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-gutter: stable;
  }

  .btn {
    border: 1px solid var(--border-strong);
    background: var(--panel);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 13px;
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 550;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.14s ease, border-color 0.14s ease, color 0.14s ease;
    min-height: 34px;
    text-align: center;
  }

  .btn:hover:not(:disabled) {
    background: #1a2230;
    border-color: #41516a;
  }
  .btn:active:not(:disabled) { background: #151d29; }
  .btn:disabled { opacity: 0.45; cursor: default; }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }

  .btn-hop {
    background: #3a1010;
    border-color: #6a2020;
    color: #ffb4ae;
  }
  .btn-hop:hover:not(:disabled) {
    background: #4a1515;
    border-color: #8a3030;
  }

  .btn-sm {
    padding: 4px 9px;
    font-size: 11.5px;
    min-height: 26px;
    border-radius: 5px;
  }

  .btn-danger {
    border-color: #5b2a2a;
    color: #ffb4ae;
    background: #211417;
  }
  .btn-danger:hover:not(:disabled) {
    border-color: #8a3a36;
    background: #2c171a;
  }

  .btn-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .grid-4 {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr);
    gap: 10px;
    align-items: start;
  }

  .card,
  .mode-bar-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 14px;
  }

  .hero-actions {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
  }
  .hero-actions .btn { width: 100%; }

  .stat-label {
    font-size: 10.5px;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    min-width: 0;
  }

  .stat-value {
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    color: #f0f6fc;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .stat-sub {
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--dim);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    min-width: 0;
  }

  .tag {
    font-size: 10px;
    font-weight: 650;
    letter-spacing: 0.03em;
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid var(--border-strong);
    background: var(--panel-2);
    color: var(--muted);
    white-space: nowrap;
  }
  .tag.ok { color: #7ee2a8; border-color: #245c3a; background: #10241a; }
  .tag.warn { color: #e7c46f; border-color: #5c4a20; background: #241d0f; }
  .tag.bad { color: #ff9c96; border-color: #5c2a2a; background: #241314; }
  .tag.dim { color: var(--dim); }

  .health-card { padding: 14px 15px; }
  .health-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }
  .health-title { font-size: 14.5px; font-weight: 650; color: var(--text); }
  .health-title.ok { color: #7ee2a8; }
  .health-title.warn { color: #e7c46f; }
  .health-title.bad { color: #ff9c96; }
  .health-sub { margin-top: 3px; font-size: 12px; color: var(--muted); line-height: 1.45; max-width: 760px; }
  .health-list { display: flex; flex-direction: column; gap: 6px; margin-top: 11px; }
  .health-list:empty { display: none; }
  .health-issue {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 11px;
    border-radius: 6px;
    border: 1px solid var(--border);
    border-left: 3px solid var(--muted);
    background: var(--panel-2);
  }
  .health-issue.warn { border-left-color: var(--amber); }
  .health-issue.bad { border-left-color: var(--red); }
  .health-issue-text { min-width: 0; }
  .health-issue-title { font-size: 12.5px; font-weight: 600; color: var(--text); }
  .health-issue-detail { margin-top: 2px; font-size: 11.5px; color: var(--muted); line-height: 1.45; }
  .health-issue .btn { margin-left: auto; flex-shrink: 0; }

  .section-head {
    font-size: 11px;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.065em;
    color: var(--muted);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .control-list { display: flex; flex-direction: column; gap: 5px; }

  .ctrl-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 9px;
    border-radius: 6px;
    border: 1px solid transparent;
    transition: background 0.14s ease, border-color 0.14s ease;
  }
  .ctrl-row:hover {
    background: var(--panel-2);
    border-color: var(--border);
  }

  .ctrl-info { min-width: 0; }
  .ctrl-title {
    font-size: 12.5px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ctrl-desc {
    font-size: 11.5px;
    color: var(--dim);
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .switch { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    inset: 0;
    cursor: pointer;
    background: #273140;
    border: 1px solid #364356;
    border-radius: 999px;
    transition: background 0.16s ease, border-color 0.16s ease;
  }
  .slider::before {
    content: "";
    position: absolute;
    height: 14px;
    width: 14px;
    left: 2px;
    top: 2px;
    border-radius: 50%;
    background: #c7d2df;
    transition: transform 0.16s ease, background 0.16s ease;
  }
  .switch input:checked + .slider {
    background: #5a2020;
    border-color: #ff2a2a;
  }
  .switch input:checked + .slider::before {
    transform: translateX(16px);
    background: #ffffff;
  }
  .switch input:disabled + .slider { opacity: 0.4; cursor: default; }

  select.edge-select,
  .input-sm,
  .select-sm {
    background: var(--well);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: 5px;
    padding: 5px 8px;
    font-family: var(--mono);
    font-size: 11.5px;
    outline: none;
    transition: border-color 0.14s ease;
    color-scheme: dark;
  }
  select.edge-select { max-width: 195px; }
  select.edge-select:hover,
  select.edge-select:focus,
  .input-sm:focus,
  .select-sm:focus { border-color: var(--accent); }
  .input-sm::placeholder { color: #556274; }

  .mode-bar-card { display: flex; flex-direction: column; gap: 10px; }
  .mode-bar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .mode-tabs {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px;
  }
  .mode-tab {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 7px 10px;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 550;
    cursor: pointer;
    transition: background 0.14s ease, border-color 0.14s ease, color 0.14s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .mode-tab:hover { color: var(--text); border-color: var(--border-strong); background: #1a2230; }
  .mode-tab.active {
    background: var(--accent-soft);
    border-color: var(--accent-line);
    color: #ffd0d0;
  }
  .mode-subpanel {
    border-top: 1px solid var(--border);
    padding-top: 9px;
  }
  .subpanel-row { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .subpanel-info {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11.5px;
    font-family: var(--mono);
    color: var(--muted);
    flex: 1;
    min-width: 200px;
  }
  .subpanel-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex-shrink: 0; }
  .subpanel-dot.ok { background: var(--green); }
  .subpanel-dot.bad { background: var(--red); }

  .logs-card {
    display: flex;
    flex-direction: column;
    min-height: 230px;
  }
  .tabs { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
  .tab {
    padding: 5px 9px;
    border-radius: 5px;
    font-size: 11.5px;
    font-weight: 550;
    color: var(--dim);
    background: transparent;
    border: 1px solid transparent;
    cursor: pointer;
    transition: color 0.14s ease, background 0.14s ease;
    font-family: var(--sans);
  }
  .tab:hover { color: var(--text); background: var(--panel-2); }
  .tab.active {
    color: #ffd0d0;
    background: var(--accent-soft);
    border-color: var(--accent-line);
  }

  .log-box {
    margin-top: 9px;
    flex: 1;
    min-height: 158px;
    max-height: 230px;
    overflow-y: auto;
    background: var(--well);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 11px;
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.55;
    color: #b9c7d6;
    user-select: text;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .lifecycle-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    padding: 10px 14px;
  }

  .inspector {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--bg-soft);
    padding: 8px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    min-height: 42px;
  }
  .insp-left { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .insp-tag {
    font-size: 10px;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.055em;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--accent-soft);
    border: 1px solid var(--accent-line);
    color: #ffb4ae;
    flex-shrink: 0;
  }
  .insp-title { font-size: 12px; font-weight: 600; color: #dce6f1; flex-shrink: 0; }
  .insp-body {
    font-size: 11.5px;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .insp-credit { font-size: 11px; color: var(--dim); flex-shrink: 0; }
  .insp-credit strong { color: #ff8a80; font-weight: 600; }

  .float-tip {
    position: fixed;
    z-index: 9999;
    max-width: 300px;
    padding: 9px 11px;
    border-radius: 6px;
    background: #10161f;
    border: 1px solid var(--border-strong);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
    pointer-events: none;
    opacity: 0;
    transform: translateY(3px);
    transition: opacity 0.13s ease, transform 0.13s ease;
  }
  .float-tip.show { opacity: 1; transform: translateY(0); }
  .float-tip-title { font-size: 11.5px; font-weight: 650; color: #ffd0d0; margin-bottom: 3px; }
  .float-tip-body { font-size: 11.5px; line-height: 1.45; color: var(--muted); }

  .toast {
    position: fixed;
    right: 20px;
    bottom: 56px;
    z-index: 9998;
    padding: 9px 13px;
    border-radius: 6px;
    background: #131a24;
    border: 1px solid var(--border-strong);
    border-left: 3px solid var(--accent);
    font-size: 12px;
    color: var(--text);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
    transition: opacity 0.16s ease, transform 0.16s ease;
    max-width: 440px;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 10000;
    background: rgba(5, 8, 12, 0.7);
    display: none;
    place-items: center;
  }
  .modal-backdrop.show { display: grid; }
  .modal {
    width: 420px;
    max-width: 92vw;
    background: #121923;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 17px 19px;
    box-shadow: 0 20px 44px rgba(0, 0, 0, 0.6);
  }
  .modal h3 { font-size: 14.5px; margin-bottom: 7px; font-weight: 650; }
  .modal p { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-bottom: 15px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

  @media (max-width: 1120px) {
    .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .hero-actions { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-2 { grid-template-columns: minmax(0, 1fr); }
  }

  @media (max-width: 760px) {
    .topbar { padding: 10px 13px; }
    .brand-sub { display: none; }
    .main { padding: 12px 13px; }
    .hero-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: minmax(0, 1fr); }
    .mode-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .insp-body { display: none; }
    .health-head { flex-direction: column; }
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand"
         data-tip-title="#@%$#@ — Made by alex"
         data-tip-body="Windows controller for Cloudflare WARP IPv6 identity rotation, Cloudflare edge pinning, and quota-wall auto-healing across OpenCode Desktop and OpenCode CLI.">
      <div class="logo-box">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
          <path d="M12 3L4.5 20H8.2L12 11.2L15.8 20H19.5L12 3Z" fill="#ffb4ae"/>
          <circle cx="12" cy="14.5" r="2.2" fill="#ff2a2a"/>
        </svg>
      </div>
      <div>
        <div class="brand-title">
          #@%$#@
          <span class="avatar-badge">made by alex</span>
          <span class="tag ok" style="font-size:10px;font-weight:700;padding:2px 7px;margin-left:6px;">v3.0</span>
        </div>
        <div class="brand-sub">WARP IPv6 /64 Rotator &bull; Cloudflare Edge Pinner &bull; Windows Egress Lane</div>
      </div>
    </div>

    <div class="top-right">
      <div id="overallPill" class="status-pill"
           data-tip-title="Protection & Tunnel Status"
           data-tip-body="Live overall state. Green means WARP is connected and the egress route is verified. Standard mode falls back to the local route if WARP drops; strict mode refuses requests instead.">
        <span id="overallDot" class="dot"></span>
        <span id="overallText">Checking...</span>
      </div>
      <button id="btnRefresh" class="btn btn-sm"
              data-tip-title="Force Live Refresh"
              data-tip-body="Immediately polls WARP status, queries the active egress route, refreshes the opencode.ai edge pool, and updates all logs.">
        Refresh
      </button>
    </div>
  </header>

  <main class="main">
    <!-- paste the rest of the original main content here unchanged -->
  </main>

  <footer class="inspector">
    <div class="insp-left">
      <span class="insp-tag">Feature Guide</span>
      <span id="inspTitle" class="insp-title">Hover any control or metric</span>
      <span id="inspBody" class="insp-body">Move your cursor over any button, card, switch, or log tab to inspect how it works.</span>
    </div>
    <div class="insp-credit">made by <strong>alex</strong></div>
  </footer>

  <!-- original float-tip, toast, modal, and full script stay exactly as they were -->
</body>
</html>
